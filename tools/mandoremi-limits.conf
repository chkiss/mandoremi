# Drop-in for the mandoremi user unit:
#   ~/.config/systemd/user/mandoremi.service.d/limits.conf
#   systemctl --user daemon-reload && systemctl --user restart mandoremi
#
# The box has 3.7G total and the app idles around 400M. Without a cap, a
# traffic spike lets the kernel's OOM killer choose the victim — during corpus
# seeding it chose sshd, which locked us out of the server while the site
# stayed up. With a cap the app is the one that dies, and systemd restarts it.
[Service]
MemoryHigh=900M
MemoryMax=1200M
